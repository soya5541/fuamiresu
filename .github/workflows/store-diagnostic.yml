name: Tower and Rakuten diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check product pages
        shell: bash
        run: |
          python - <<'PY'
          import re
          import urllib.request
          import urllib.error
          from html.parser import HTMLParser

          ISBN = '9784047377486'
          PAGES = {
              'TOWER RECORDS': 'https://tower.jp/item/6178367',
              'RAKUTEN BOOKS': 'https://books.rakuten.co.jp/rb/17625532/',
          }
          TERMS = [
              '現在ご注文いただけません', 'お取り寄せ', '在庫あり',
              '在庫なし', '売り切れ', '販売中', 'カートに入れる',
              '注文できない', 'ご注文いただけません', '注文できる',
              'ご注文可能', '注文可能', '買い物かごに入れる',
              'ご注文を受け付けておりません', 'メーカー取り寄せ',
              '入荷待ち', '販売終了', '在庫切れ',
          ]

          class TextOnly(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.skip = 0
              def handle_starttag(self, tag, attrs):
                  if tag in ('script', 'style', 'noscript'):
                      self.skip += 1
              def handle_endtag(self, tag):
                  if tag in ('script', 'style', 'noscript') and self.skip:
                      self.skip -= 1
              def handle_data(self, data):
                  if not self.skip:
                      self.parts.append(data)

          for name, url in PAGES.items():
              print('\n' + '=' * 55, flush=True)
              print(name, url, flush=True)
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0 Safari/537.36',
                  'Accept-Language': 'ja-JP,ja;q=0.9,en;q=0.5',
              })
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      raw = response.read(2_000_000)
                      print('HTTP:', response.status)
                      print('Final URL:', response.url)
                      charset = response.headers.get_content_charset() or 'utf-8'
                  html = raw.decode(charset, errors='replace')
                  parser = TextOnly()
                  parser.feed(html)
                  visible = re.sub(r'\s+', ' ', ' '.join(parser.parts))
                  print('ISBN in HTML:', ISBN in html)
                  print('HTML bytes:', len(raw))
                  found = False
                  for term in TERMS:
                      match = re.search(re.escape(term), visible)
                      if match:
                          found = True
                          print('MATCH:', repr(term), 'CONTEXT:', visible[max(0, match.start()-65):match.end()+65])
                  if not found:
                      print('No known status terms found in visible text')
                  print('Page text sample:', visible[:350])
                  print('RESULT: fetched; stock status NOT automatically confirmed')
              except urllib.error.HTTPError as error:
                  print('RESULT: HTTP ERROR', error.code)
              except Exception as error:
                  print('RESULT: ERROR', type(error).__name__, str(error)[:200])
          PY
