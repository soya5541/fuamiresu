name: Kinokuniya and Maruzen diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-bookstores:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install HTML parser
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Diagnose both stores
        shell: bash
        run: |
          python - <<'PY'
          import json, re, time
          import requests
          from bs4 import BeautifulSoup

          ISBN = '9784047377486'
          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              'Accept-Language': 'ja-JP,ja;q=0.9',
              'Accept': 'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8',
          }
          session = requests.Session()
          targets = [
              ('Kinokuniya product', 'https://www.kinokuniya.co.jp/f/dsg-01-9784047377486', 22),
              ('Maruzen product', 'https://www.maruzenjunkudo.co.jp/products/9784047377486', 22),
              ('Maruzen Shopify product JSON', 'https://www.maruzenjunkudo.co.jp/products/9784047377486.js', 18),
          ]
          signals = [
              'ただいまウェブストアではご注文を受け付けておりません',
              'ご注文を受け付けておりません', 'ご注文いただけません',
              'ウェブストア在庫あり', '倉庫に在庫がございます',
              'カートに入れる', 'カートに追加する', '通販で購入',
              'ネットストア在庫なし', '通販在庫なし', '売り切れ',
              '在庫切れ', '在庫なし', 'お取り寄せ', '取り寄せ',
              '予約受付', '購入する',
          ]

          for name, url, timeout in targets:
              print('\n' + '=' * 65, flush=True)
              print('TEST:', name, flush=True)
              print('URL:', url, flush=True)
              for attempt in range(1, 3 if name == 'Kinokuniya product' else 2):
                  print('ATTEMPT:', attempt, flush=True)
                  try:
                      r = session.get(url, headers=HEADERS, timeout=timeout)
                      print('HTTP:', r.status_code, 'BYTES:', len(r.content), flush=True)
                      print('FINAL URL:', r.url, flush=True)
                      print('CONTENT TYPE:', r.headers.get('Content-Type', '(missing)'), flush=True)
                      if r.status_code != 200:
                          print('RESULT: http_error; no stock inference', flush=True)
                          continue
                      if 'JSON' in name:
                          try:
                              obj = r.json()
                              print('JSON KEYS:', list(obj)[:20] if isinstance(obj, dict) else type(obj).__name__, flush=True)
                              if isinstance(obj, dict):
                                  print('TITLE:', str(obj.get('title', ''))[:160], flush=True)
                                  print('VARIANTS:', len(obj.get('variants', [])), flush=True)
                                  for variant in obj.get('variants', [])[:5]:
                                      print('VARIANT:', json.dumps({k: variant.get(k) for k in ('id','title','sku','available','inventory_quantity','inventory_management')}, ensure_ascii=False), flush=True)
                                  print('ISBN MATCH:', ISBN in json.dumps(obj, ensure_ascii=False), flush=True)
                              print('RESULT: json_parsed; verify variant belongs to exact ISBN', flush=True)
                          except ValueError:
                              print('RESULT: not_json', flush=True)
                          break
                      soup = BeautifulSoup(r.text, 'html.parser')
                      print('PAGE TITLE:', soup.title.get_text(' ', strip=True)[:160] if soup.title else '(none)', flush=True)
                      for node in soup(['script','style','noscript','svg']):
                          node.decompose()
                      text = ' '.join(soup.stripped_strings)
                      print('ISBN IN VISIBLE TEXT:', ISBN in text, flush=True)
                      print('SPECIAL EDITION IN TEXT:', 'アクリルスタンド付き特装版' in text, flush=True)
                      print('SIGNALS IN WHOLE PAGE:', [s for s in signals if s in text], flush=True)
                      for word in ('ご注文を受け付けておりません','売り切れ','カートに入れる','カートに追加する','ネットストア在庫'):
                          for m in list(re.finditer(re.escape(word), text))[:2]:
                              print('CONTEXT', repr(word), ':', text[max(0,m.start()-110):m.end()+140], flush=True)
                      if name == 'Maruzen product':
                          for sel in ('form[action*="/cart/add"]', 'button[name="add"]', '[data-product-id]', '.product-form', '.product__info-container'):
                              nodes = soup.select(sel)
                              print('SELECTOR', repr(sel), 'COUNT:', len(nodes), flush=True)
                              for node in nodes[:2]:
                                  print('  TEXT:', node.get_text(' ',strip=True)[:280], flush=True)
                                  print('  ATTRS:', {k:v for k,v in node.attrs.items() if k in ('disabled','class','data-product-id','name','type')}, flush=True)
                      print('RESULT: html_parsed; inspect product-specific status (not whole-page keywords)', flush=True)
                      break
                  except requests.RequestException as e:
                      print('REQUEST ERROR:', type(e).__name__, str(e)[:220], flush=True)
                      print('RESULT: request_error; no stock inference', flush=True)
                      if attempt == 1 and name == 'Kinokuniya product':
                          time.sleep(2)
              time.sleep(1)
          print('\nDIAGNOSTIC ONLY: no notifications, no stock claims, no repository modifications.', flush=True)
          PY
