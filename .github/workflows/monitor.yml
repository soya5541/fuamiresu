name: Special edition stock monitor
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: stock-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python monitor.py
      - name: Create GitHub issue on new possible availability
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, subprocess, requests
          from datetime import datetime,timezone
          for a in json.load(open('alerts.json')):
              title=f"[재고 감지] {a['name']} - ファミレス行こ。 특장판"
              body=f"주문 가능성을 나타내는 문구가 감지되었습니다. 실제 주문 가능 여부는 반드시 상품 페이지에서 확인하세요.\n\n판매처: {a['name']}\n표시 문구: {a['detail']}\n상품 링크: {a['url']}\n확인 시각(UTC): {datetime.now(timezone.utc).isoformat()}\n\n자동 판독 결과로 오탐이 있을 수 있습니다."
              subprocess.run(['gh','issue','create','--title',title,'--body',body],check=True)
              if os.getenv('TELEGRAM_BOT_TOKEN') and os.getenv('TELEGRAM_CHAT_ID'):
                  response=requests.post(f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",json={'chat_id':os.environ['TELEGRAM_CHAT_ID'],'text':title+'\n'+a['url']+'\n'+a['detail']},timeout=15)
                  response.raise_for_status()
          PY
      - name: Save state for deduplication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update stock monitor state'
            git push
          fi
