name: Special edition stock monitor

on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Send one test GitHub Issue and Gmail email, without running monitor'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: stock-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Check stock
        if: ${{ inputs.test_notification != true }}
        run: python monitor.py
      - name: Create GitHub issue for new availability or notification test
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          import requests
          import smtplib
          from email.message import EmailMessage

          test = os.getenv('TEST_NOTIFICATION', '').lower() == 'true'
          if test:
              alerts = [{
                  'name': 'TEST',
                  'url': 'https://github.com/${{ github.repository }}/actions',
                  'detail': '테스트 메시지입니다. 실제 재고 감지가 아닙니다.',
              }]
          else:
              with open('alerts.json', encoding='utf-8') as f:
                  alerts = json.load(f)

          for alert in alerts:
              title = ('[테스트 알림] 파미레스 특장판 모니터' if test else
                       f"[재고 감지] {alert['name']} - ファミレス行こ。 특장판")
              body = (
                  ('알림 연결 테스트입니다. 실제 재고가 발견된 것이 아닙니다.' if test else
                   '주문 가능성을 나타내는 신호가 감지됐습니다. 실제 주문 가능 여부는 상품 페이지에서 확인하세요.')
                  + f"\n\n판매처: {alert['name']}"
                  + f"\n표시 문구: {alert['detail']}"
                  + f"\n상품 링크: {alert['url']}"
                  + f"\n확인 시각(UTC): {datetime.now(timezone.utc).isoformat()}"
                  + '\n\n자동 판독 결과에는 오탐이 있을 수 있습니다.'
              )
              subprocess.run(['gh', 'issue', 'create', '--title', title, '--body', body], check=True)
              mail_address = os.getenv('GMAIL_ADDRESS', '').strip()
              app_password = os.getenv('GMAIL_APP_PASSWORD', '').strip()
              if not mail_address or not app_password:
                  raise RuntimeError('Email secrets GMAIL_ADDRESS and GMAIL_APP_PASSWORD are required')
              msg = EmailMessage()
              msg['Subject'] = title
              msg['From'] = mail_address
              msg['To'] = mail_address
              msg.set_content(body)
              with smtplib.SMTP_SSL('smtp.gmail.com', 465, timeout=25) as smtp:
                  smtp.login(mail_address, app_password)
                  smtp.send_message(msg)
              print('Gmail email sent successfully')
              token = os.getenv('TELEGRAM_BOT_TOKEN')
              chat_id = os.getenv('TELEGRAM_CHAT_ID')
              if token and chat_id:
                  try:
                      response = requests.post(
                          f'https://api.telegram.org/bot{token}/sendMessage',
                          json={'chat_id': chat_id, 'text': title + '\n' + alert['url'] + '\n' + alert['detail']},
                          timeout=15,
                      )
                      response.raise_for_status()
                      print('Telegram delivery request succeeded')
                  except requests.RequestException as exc:
                      # An issue was already created; avoid repeating it every run.
                      print('WARNING: Telegram delivery failed:', type(exc).__name__)
              else:
                  print('Telegram not configured; Gmail and GitHub Issue used')
          PY
      - name: Save state for deduplication
        if: ${{ inputs.test_notification != true }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update stock monitor state'
            git push
          fi
